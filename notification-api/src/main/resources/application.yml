spring:
  application:
    name: notification-api
  mongodb:
    # Matches compose.yaml; override with MONGODB_URI in other environments.
    uri: ${MONGODB_URI:mongodb://localhost:27017/notifications}
  data:
    mongodb:
      # Creates the indexes declared on the document classes (the outbox) at startup.
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # A Redis outage fails a command within seconds instead of holding the request for a minute.
      timeout: 2s
      connect-timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Wait for every in-sync replica, and let the broker drop duplicates caused by client retries.
      acks: all
      properties:
        enable.idempotence: true
        # Consumers know the event type from the topic, not from a Java class name in a header.
        spring.json.add.type.headers: false
        # Fail a send quickly when the broker is unreachable; the outbox relay tries again later.
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: notification-api
      # A new consumer group starts from the oldest event, so no delivery result is skipped.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A record that cannot be read is handed to the error handler instead of blocking the partition.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # The event type comes from this setting, never from a class name sent by the producer.
        spring.json.use.type.headers: false
        spring.json.value.default.type: io.github.khaledx5.notifications.events.DeliveryStatusChanged

notifications:
  events:
    # How long the outbox relay waits for the broker to confirm an event.
    send-timeout: 5s
    topic-partitions: 3
    topic-replicas: 1
  outbox:
    # Pause between two runs of the relay that publishes waiting events to Kafka.
    poll-interval: 500ms
    # Most events published in one run.
    batch-size: 100
    # How long a relay keeps an event to itself while publishing it; also the wait before a failed
    # publish is tried again. Has to be longer than the slowest publish.
    claim-duration: 30s
  idempotency:
    # How long a repeated request with the same Idempotency-Key gets the first notification back.
    ttl: 24h
    # How long a key stays reserved if its first request never finishes, e.g. the service was stopped.
    in-progress-ttl: 1m
  templates:
    # How long a template is served from Redis before it is read from MongoDB again.
    cache-ttl: 10m

server:
  port: 8080

springdoc:
  # OpenAPI JSON at /v3/api-docs, Swagger UI at /swagger-ui.html
  paths-to-match: /api/**
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
