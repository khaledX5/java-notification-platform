spring:
  application:
    name: delivery-worker
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      # Every event that is sent carries the trace it belongs to (W3C traceparent header).
      observation-enabled: true
    listener:
      # Every event that is consumed continues the trace it arrived with, retries included.
      observation-enabled: true
    consumer:
      group-id: delivery-worker
      # A new consumer group starts from the oldest event, so nothing requested before it is skipped.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A record that cannot be read is handed to the error handler instead of blocking the partition.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # The event type comes from this setting, never from a class name sent by the producer.
        spring.json.use.type.headers: false
        spring.json.value.default.type: io.github.khaledx5.notifications.events.NotificationRequested
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Wait for every in-sync replica, and let the broker drop duplicates caused by client retries.
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
        # Fail a send quickly when the broker is unreachable; the request event is then read again.
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # A Redis outage fails a command within seconds instead of holding up the partition for a minute.
      timeout: 2s
      connect-timeout: 2s
  mail:
    # Matches Mailpit in compose.yaml; point these at a real SMTP server in other environments.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

notifications:
  events:
    # How long the worker waits for the broker to confirm a status event.
    send-timeout: 5s
    topic-partitions: 3
    topic-replicas: 1
  delivery:
    retry:
      # Total tries per notification, the first one included. After the last one it is reported as failed.
      attempts: 4
      # Wait before the first retry; each further retry waits `multiplier` times longer, up to `max-delay`.
      delay: 2s
      multiplier: 3
      max-delay: 1m
    deduplication:
      # How long the result of an event is remembered, so the same event arriving again is not sent twice.
      ttl: 24h
    rate-limit:
      # Most notifications one recipient gets at once on one channel. One over the limit is retried
      # like a failed delivery, so it normally arrives a little later.
      capacity: 10
      # Time to earn one of them back: 6s allows 10 per minute once the burst is used up.
      refill-interval: 6s
    email:
      from: ${EMAIL_FROM:no-reply@notifications.local}

server:
  port: 8081

management:
  health:
    mail:
      # An SMTP outage must not take the worker out of rotation: it keeps consuming the other channels.
      enabled: false
    redis:
      # The worker keeps delivering without Redis, so a Redis outage must not report it as down either.
      enabled: false
  endpoints:
    web:
      exposure:
        # Metrics as JSON under /actuator/metrics and in Prometheus format under /actuator/prometheus.
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
