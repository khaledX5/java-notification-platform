spring:
  application:
    name: delivery-worker
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: delivery-worker
      # A new consumer group starts from the oldest event, so nothing requested before it is skipped.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A record that cannot be read is handed to the error handler instead of blocking the partition.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # The event type comes from this setting, never from a class name sent by the producer.
        spring.json.use.type.headers: false
        spring.json.value.default.type: io.github.khaledx5.notifications.events.NotificationRequested
  mail:
    # Matches Mailpit in compose.yaml; point these at a real SMTP server in other environments.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

notifications:
  delivery:
    email:
      from: ${EMAIL_FROM:no-reply@notifications.local}

server:
  port: 8081

management:
  health:
    mail:
      # An SMTP outage must not take the worker out of rotation: it keeps consuming the other channels.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
