spring:
  application:
    name: delivery-worker
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: delivery-worker
      # A new consumer group starts from the oldest event, so nothing requested before it is skipped.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A record that cannot be read is handed to the error handler instead of blocking the partition.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # The event type comes from this setting, never from a class name sent by the producer.
        spring.json.use.type.headers: false
        spring.json.value.default.type: io.github.khaledx5.notifications.events.NotificationRequested
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Wait for every in-sync replica, and let the broker drop duplicates caused by client retries.
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
        # Fail a send quickly when the broker is unreachable; the request event is then read again.
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  mail:
    # Matches Mailpit in compose.yaml; point these at a real SMTP server in other environments.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

notifications:
  events:
    # How long the worker waits for the broker to confirm a status event.
    send-timeout: 5s
    topic-partitions: 3
    topic-replicas: 1
  delivery:
    retry:
      # Total tries per notification, the first one included. After the last one it is reported as failed.
      attempts: 4
      # Wait before the first retry; each further retry waits `multiplier` times longer, up to `max-delay`.
      delay: 2s
      multiplier: 3
      max-delay: 1m
    email:
      from: ${EMAIL_FROM:no-reply@notifications.local}

server:
  port: 8081

management:
  health:
    mail:
      # An SMTP outage must not take the worker out of rotation: it keeps consuming the other channels.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
