# Local infrastructure for development, and optionally the two services as well.
#
# Infrastructure only (run the services from the IDE or with ./mvnw spring-boot:run):
#   docker compose up -d
#
# Everything, with the services built from source into images:
#   docker compose --profile app up -d --build
#
# Stop:
#   docker compose --profile app down        (add -v to also delete the data volumes)

name: notification-platform

services:
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the services, not created on first use.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  mongodb:
    image: mongo:9.0
    # Single-node replica set: MongoDB transactions (used by the outbox) need one.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    # Fake SMTP server; open http://localhost:8025 to see the delivered emails.
    image: axllent/mailpit:v1.33
    ports:
      - "1025:1025"
      - "8025:8025"

  notification-api:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: notification-api
    image: notification-platform/notification-api
    ports:
      - "8080:8080"
    environment:
      # The replica set member calls itself localhost:27017, which only works from the host.
      # directConnection makes the driver use the address it was given instead.
      MONGODB_URI: mongodb://mongodb:27017/notifications?directConnection=true
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  delivery-worker:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: delivery-worker
    image: notification-platform/delivery-worker
    ports:
      - "8081:8081"
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mongodb-data:
