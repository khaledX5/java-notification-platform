name: Bug report
description: Something does not behave as expected
labels: [bug]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - notification-api
        - delivery-worker
        - build / CI
        - other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up -d
        2. ./mvnw verify
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      render: text

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "JDK 21, Docker 28, Windows 11"
