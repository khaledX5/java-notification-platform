name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format check, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Summarize test coverage
        run: |
          {
            echo "### Test coverage"
            echo
            echo "| Module | Lines | Branches |"
            echo "| --- | --- | --- |"
            for csv in */target/site/jacoco/jacoco.csv; do
              awk -F, -v module="${csv%%/*}" '
                NR > 1 { branchMissed += $6; branchCovered += $7; lineMissed += $8; lineCovered += $9 }
                END {
                  lines = lineMissed + lineCovered
                  branches = branchMissed + branchCovered
                  printf "| %s | %.1f%% | %.1f%% |\n", module,
                    (lines ? 100 * lineCovered / lines : 100),
                    (branches ? 100 * branchCovered / branches : 100)
                }' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: "*/target/site/jacoco/"
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  full-stack:
    name: Docker images and full-stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the images and start the platform
        run: docker compose --profile app up --detach --build --wait --wait-timeout 300

      - name: Send a notification and wait for its delivery
        run: |
          location=$(curl --fail --silent --show-error --dump-header - --output /dev/null \
            --request POST http://localhost:8080/api/v1/notifications \
            --header 'Content-Type: application/json' \
            --data '{"recipient": "smoke@example.com", "channel": "EMAIL", "subject": "Smoke test", "body": "The platform is up"}' \
            | awk 'tolower($1) == "location:" { print $2 }' | tr -d '\r')
          echo "notification: $location"

          for attempt in $(seq 1 30); do
            status=$(curl --fail --silent "$location" | jq --raw-output .status)
            if [ "$status" = "DELIVERED" ]; then break; fi
            sleep 1
          done
          echo "status: $status"
          test "$status" = "DELIVERED"

          # The email really went through SMTP: the fake server has it.
          curl --fail --silent http://localhost:8025/api/v1/messages | jq --exit-status '.total == 1'

      - name: Show the logs of the services
        if: failure()
        run: docker compose --profile app logs notification-api delivery-worker

      - name: Stop the platform
        if: always()
        run: docker compose --profile app down --volumes
